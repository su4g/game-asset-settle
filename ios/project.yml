name: BuffReader
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  BuffReaderCore:
    path: .
targets:
  BuffReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: BuffReaderCore
        product: BuffReaderCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 饰品交易账本
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 饰品交易账本连接
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.buffhelper.connection]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.buffhelper.connection
            UTTypeDescription: 饰品交易账本连接
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [buffconnection]
              public.mime-type: application/json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buffhelper.reader
        PRODUCT_NAME: BuffReader
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  BuffReader:
    build:
      targets:
        BuffReader: all
    run:
      config: Debug
    archive:
      config: Release
